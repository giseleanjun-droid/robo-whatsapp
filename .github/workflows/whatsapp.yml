name: WhatsApp Anjun

# Repositório PÚBLICO (minutos ilimitados). Aqui só há código: as mensagens vêm da planilha
# MATRIZ SLA + BACKLOG no Drive, e a sessão do WhatsApp fica CRIPTOGRAFADA no cache do GitHub
# (a chave WA_CHAVE é um segredo; quem abrir o cache sem ela só vê lixo).
on:
  schedule:
    # O agendador do GitHub às vezes PULA um horário (15/11 pulou o das 08:47). Por isso há 4 tentativas;
    # a primeira que enviar marca o dia como "enviado" e as outras não fazem nada (nunca manda 2 vezes).
    - cron: "47 11 * * *"     # 08:47 de Brasília
    - cron: "13 12 * * *"     # 09:13
    - cron: "41 12 * * *"     # 09:41
    - cron: "17 13 * * *"     # 10:17
    - cron: "0 0 * * *"       # 21:00 VIGIA: só confere se o WhatsApp continua conectado (não envia)
  workflow_dispatch:
    inputs:
      modo:
        description: "enviar | expedicao (expedição do GO-74 por bairro) | grupos (só confere os grupos, não envia) | vigia (só testa a conexão) | parear (conectar o WhatsApp)"
        default: "enviar"
      teste:
        description: "sim = TODAS as mensagens vão só para o grupo de teste (segredo WA_GRUPO_TESTE)"
        default: "nao"
      so_bases:
        description: "Opcional: só estas bases (ex.: GO-W-D001 GO-W-D009)"
        default: ""
      turno:
        description: "Só para modo expedicao: manha ou tarde (vazio = pela hora)"
        default: ""
      automatico:
        description: "sim = disparo do Despertador: respeita a trava de 1 envio por dia"
        default: "nao"

permissions:
  contents: read

concurrency:
  group: whatsapp
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Sao_Paulo
      MODO: ${{ github.event.schedule == '0 0 * * *' && 'vigia' || github.event.inputs.modo || 'enviar' }}
      GRUPO_TESTE: ${{ github.event.inputs.teste == 'sim' && secrets.WA_GRUPO_TESTE || '' }}
      SO_BASES: ${{ github.event.inputs.so_bases || '' }}
      TURNO: ${{ github.event.inputs.turno || '' }}
      DRIVE_TOKEN: /tmp/segredos/sa.json
      PASTA_SLA: ${{ secrets.PASTA_SLA }}
      WA_TELEFONE: ${{ secrets.WA_TELEFONE }}
      ALERTA_REMETENTE: ${{ secrets.ALERTA_REMETENTE }}
      ALERTA_SENHA: ${{ secrets.ALERTA_SENHA }}
      ALERTA_PARA: ${{ secrets.ALERTA_PARA }}
    steps:
      - name: Já enviou hoje?
        id: dia
        run: |
          echo "data=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          T="${TURNO:-$([ "$(date +%H)" -lt 12 ] && echo manha || echo tarde)}"
          echo "turno=$T" >> "$GITHUB_OUTPUT"
          echo "TURNO=$T" >> "$GITHUB_ENV"

      - name: Conferir marca de envio do dia
        id: marca
        if: (github.event_name == 'schedule' || github.event.inputs.automatico == 'sim') && env.MODO == 'enviar'
        uses: actions/cache/restore@v4
        with:
          path: enviado.txt
          key: wa-enviado-${{ steps.dia.outputs.data }}
          lookup-only: true

      - name: Conferir marca da expedição do turno
        id: marcaexp
        if: github.event.inputs.automatico == 'sim' && env.MODO == 'expedicao'
        uses: actions/cache/restore@v4
        with:
          path: exped.txt
          key: wa-exped-${{ steps.dia.outputs.data }}-${{ steps.dia.outputs.turno }}
          lookup-only: true

      - name: Parar (a expedição deste turno já foi enviada)
        if: steps.marcaexp.outputs.cache-hit == 'true'
        run: echo "Expedição deste turno já enviada. Nada a fazer." && echo "JA_ENVIOU=1" >> "$GITHUB_ENV"

      - name: Parar (o envio de hoje já foi feito)
        if: steps.marca.outputs.cache-hit == 'true'
        run: echo "Mensagens de hoje já enviadas numa tentativa anterior. Nada a fazer." && echo "JA_ENVIOU=1" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.JA_ENVIOU != '1'

      - uses: actions/setup-node@v4
        if: env.JA_ENVIOU != '1'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: env.JA_ENVIOU != '1'
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        if: env.JA_ENVIOU != '1'
        run: |
          npm install --no-audit --no-fund --silent
          pip install --quiet -r requirements.txt

      - name: Preparar segredos
        if: env.JA_ENVIOU != '1'
        env:
          SA_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          mkdir -p /tmp/segredos
          printf '%s' "$SA_JSON" > /tmp/segredos/sa.json
          chmod 600 /tmp/segredos/*
          test -s /tmp/segredos/sa.json || { echo "Segredo DRIVE_TOKEN_JSON vazio"; exit 1; }

      - name: Recuperar sessão do WhatsApp (criptografada)
        if: env.JA_ENVIOU != '1'
        uses: actions/cache/restore@v4
        with:
          path: auth.tar.enc
          key: wa-auth-${{ github.run_id }}
          restore-keys: wa-auth-

      - name: Abrir sessão
        if: env.JA_ENVIOU != '1'
        env:
          WA_CHAVE: ${{ secrets.WA_CHAVE }}
        run: |
          test -n "$WA_CHAVE" || { echo "Segredo WA_CHAVE vazio"; exit 1; }
          mkdir -p auth
          if [ -f auth.tar.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:WA_CHAVE -in auth.tar.enc | tar -xz -C auth \
              && echo "sessão recuperada" || echo "sessão não abriu (vai precisar parear)"
          else
            echo "sem sessão guardada (vai precisar parear)"
          fi

      - name: Ler a matriz do dia
        if: env.JA_ENVIOU != '1' && env.MODO != 'parear' && env.MODO != 'vigia'
        run: python ${{ env.MODO == 'expedicao' && 'ler_expedicao.py' || 'ler_matriz.py' }}

      - name: WhatsApp
        if: env.JA_ENVIOU != '1'
        id: wa
        run: node enviar.mjs

      - name: Salvar marca de envio do dia
        if: always() && env.JA_ENVIOU != '1' && hashFiles('enviado.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: enviado.txt
          key: wa-enviado-${{ steps.dia.outputs.data }}

      - name: Salvar marca da expedição do turno
        if: always() && env.JA_ENVIOU != '1' && hashFiles('exped.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: exped.txt
          key: wa-exped-${{ steps.dia.outputs.data }}-${{ steps.dia.outputs.turno }}

      - name: E-mail com o resumo
        if: env.JA_ENVIOU != '1' && (always() && env.MODO != 'parear')
        run: python relatorio.py ${{ env.MODO == 'vigia' && 'vigia' || (env.MODO == 'expedicao' && 'expedicao' || 'envio') }}

      - name: Guardar sessão (criptografada)
        if: env.JA_ENVIOU != '1' && (always())
        env:
          WA_CHAVE: ${{ secrets.WA_CHAVE }}
        run: |
          if [ -f auth/creds.json ]; then
            tar -cz -C auth . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:WA_CHAVE -out auth.tar.enc
          fi

      - name: Salvar no cache
        if: env.JA_ENVIOU != '1' && (always() && hashFiles('auth.tar.enc') != '')
        uses: actions/cache/save@v4
        with:
          path: auth.tar.enc
          key: wa-auth-${{ github.run_id }}

      - name: Apagar segredos e dados
        if: env.JA_ENVIOU != '1' && (always())
        run: rm -rf /tmp/segredos auth codigo.txt mensagens.json resultado.json motivo.txt exped.txt
